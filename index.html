<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B7866">
<title>Nerding Library</title>
<meta name="description" content="Videos, articles, books and papers shared in the group, in one searchable place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF5EB; --paper:#FFFDF7; --ink:#2C332A; --ink-2:#4F5A4B; --ink-3:#7F877A;
    --line:#E4DED0; --accent:#56634F; --accent-soft:#E6EBDF; --chip:#EFEADD;
    --brand:#6B7866; --brand-ink:#FAF5EB; --olive:#C3C133;
    --head:Montserrat,"Helvetica Neue",Arial,sans-serif;
    --radius:16px; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171a16; --paper:#20241f; --ink:#F1EEE4; --ink-2:#C9CCBF; --ink-3:#8E9488;
      --line:#323830; --accent:#B8C4A8; --accent-soft:#2D3529; --chip:#292E27; --brand:#4A5446;
      --shadow:0 1px 2px rgba(0,0,0,.3); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:15px/1.55 Lato,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button,input,select{font:inherit;color:inherit}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

  header{padding:24px 0 20px;display:flex;align-items:flex-start;gap:12px;background:var(--brand);color:var(--brand-ink);
    box-shadow:0 0 0 100vmax var(--brand);clip-path:inset(0 -100vmax);margin-bottom:14px}
  header .sub{color:var(--brand-ink);opacity:.85}
  header .status{color:var(--brand-ink);opacity:.75}
  header .iconbtn{background:rgba(250,245,235,.12);border-color:rgba(250,245,235,.35);color:var(--brand-ink);box-shadow:none}
  header .t{flex:1;min-width:0}
  h1{font-family:var(--head);font-weight:700;font-style:italic;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--olive)}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:4px}
  .status{font-size:12px;color:var(--ink-3);margin-top:6px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--olive);flex:none}
  .dot.warn{background:#d39a2c}.dot.off{background:#b9483a}
  .iconbtn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
    display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
  .iconbtn svg{width:20px;height:20px}
  .spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-family:var(--head);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .tab .n{opacity:.6;margin-left:4px;font-size:12.5px}

  .toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .search{position:relative}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
  .search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);
    padding:0 40px 0 40px;font-size:16px;outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--accent)}
  .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;border-radius:10px;cursor:pointer;color:var(--ink-3);display:none}
  .row{display:flex;gap:8px;margin-top:8px}
  .pill{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 12px;display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:500;font-size:14px}
  .pill svg{width:17px;height:17px}
  .badge{background:var(--brand);color:#fff;border-radius:999px;font-size:11.5px;min-width:19px;height:19px;display:inline-grid;place-items:center;padding:0 5px}
  .frow{align-items:center;margin-right:-16px}
  .frow .pill{flex:none}
  .sortwrap{position:relative;display:flex;align-items:center;gap:6px;flex:none}
  .sortlab{font-size:13px;color:var(--ink-3)}
  .sortwrap select{appearance:none;-webkit-appearance:none;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 30px 0 11px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .sortwrap svg{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;pointer-events:none;color:var(--ink-3)}

  .chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-right:16px;
    -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin:10px 0 0}
  .linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:13px}

  .list{display:grid;gap:12px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px 14px;box-shadow:var(--shadow)}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
  .type{display:inline-flex;align-items:center;gap:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:var(--ink-2)}
  .type i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .card h2{font-family:var(--head);font-weight:600;font-size:17px;line-height:1.25;margin:8px 0 2px}
  .card h2 small{display:block;font-family:Lato,system-ui,sans-serif;font-weight:400;font-size:13px;font-style:italic;color:var(--ink-3);margin-top:2px}
  .by{font-size:13.5px;color:var(--ink-2)}
  .card.tap{cursor:pointer}
  .sum{font-size:14.5px;color:var(--ink-2);margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .more{border:0;background:none;padding:6px 0 0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer}

  /* details panel */
  .detail .bd{padding:2px 20px 8px}
  .detail .dtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);margin-top:4px}
  .detail h2{font-family:var(--head);font-weight:700;font-size:21px;line-height:1.2;margin:8px 0 4px}
  .detail h2 small{display:block;font-family:Lato,system-ui,sans-serif;font-weight:400;font-size:14px;font-style:italic;color:var(--ink-3);margin-top:4px}
  .detail .dsum{font-size:15.5px;line-height:1.6;color:var(--ink);margin:12px 0 4px;white-space:pre-line}
  .detail dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
  .detail dt{color:var(--ink-3)}
  .detail dd{margin:0;color:var(--ink);font-weight:500;min-width:0;overflow-wrap:anywhere}
  .detail dd .chip{margin:0 5px 5px 0;font-size:12.5px;padding:5px 10px}
  .detail .ft a{flex:1.6;height:46px;border-radius:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--brand);color:var(--brand-ink);text-decoration:none}
  .detail .ft a svg{width:16px;height:16px}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tags .chip{font-size:12px;padding:4px 9px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .rec{font-size:12.5px;color:var(--ink-3);min-width:0}
  .rec b{color:var(--ink-2);font-weight:600}
  .open{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:var(--brand-ink);text-decoration:none;border-radius:11px;padding:9px 13px;font-weight:600;font-size:13.5px}
  .open svg{width:15px;height:15px}

  .simple{display:flex;align-items:center;gap:12px;text-decoration:none}
  .simple .lab{flex:none;min-width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:650;font-size:13px;text-align:center;line-height:1.1;padding:4px}
  .simple .txt{flex:1;min-width:0}
  .simple .txt b{display:block;font-family:var(--head);font-weight:600;font-size:15.5px;line-height:1.25}
  .simple .txt span{font-size:12.5px;color:var(--ink-3)}
  .simple svg{width:18px;height:18px;color:var(--ink-3);flex:none}

  .empty{text-align:center;color:var(--ink-3);padding:40px 10px}
  .empty b{display:block;color:var(--ink-2);font-size:16px;margin-bottom:4px}
  .skeleton{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,var(--chip),var(--paper),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* bottom sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,14,6,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;
    transform:translateY(105%);transition:transform .25s ease;max-width:720px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
  .sheet.on{transform:none}.scrim.on{opacity:1;pointer-events:auto}
  .sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0}
  .sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 6px}
  .sheet .hd h3{margin:0;font-family:var(--head);font-size:19px;font-weight:700}
  .sheet .bd{overflow:auto;padding:4px 18px 10px}
  .sheet h4{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
  .sheet .wrapchips{display:flex;flex-wrap:wrap;gap:7px}
  .sheet .wrapchips .chip{padding:8px 12px;font-size:13.5px}
  .sheet .ft{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sheet .ft button{flex:1;height:46px;border-radius:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--paper)}
  .sheet .ft .primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  footer{text-align:center;font-size:12px;color:var(--ink-3);margin-top:28px}
  footer a{color:var(--ink-2)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t">
      <h1>Nerding <span>Library</span></h1>
      <div class="sub">Videos, articles, books and papers shared in the group.</div>
    </div>
    <button class="iconbtn" id="refresh" aria-label="Refresh from the sheet" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section id="libView">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search titles, people, topics…" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="qclear" aria-label="Clear search">✕</button>
      </div>
      <div class="row frow">
        <button class="pill" id="openFilters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters <span class="badge hidden" id="fcount">0</span>
        </button>
        <div class="chips" id="quickTags" aria-label="Topics"></div>
      </div>
      <div class="meta">
        <span><span id="count"></span> <button class="linkbtn hidden" id="clearAll">· Clear filters</button></span>
        <label class="sortwrap">
          <span class="sortlab">Sort</span>
          <select id="sort" aria-label="Sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="title">Title A–Z</option>
            <option value="speaker">Speaker / writer A–Z</option>
            <option value="type">Type</option>
            <option value="rec">Recommended by</option>
          </select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </label>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="simpleView" class="hidden">
    <div class="list" id="simpleList" style="margin-top:6px"></div>
  </section>

  <footer>Want to add something? Ask an admin to add it to the <a id="sheetLink" href="#" target="_blank" rel="noopener">sheet</a>. It shows up here automatically.</footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="grab"></div>
  <div class="hd"><h3>Filters</h3><button class="linkbtn" id="sheetClear">Clear all</button></div>
  <div class="bd" id="sheetBody"></div>
  <div class="ft"><button id="sheetClose">Close</button><button class="primary" id="sheetApply">Show results</button></div>
</div>
<div class="sheet detail" id="detail" role="dialog" aria-modal="true" aria-label="Resource details">
  <div class="grab"></div>
  <div class="bd" id="detailBody"></div>
  <div class="ft" id="detailFt"></div>
</div>

const SNAPSHOT = {"taken": "18 Nov 2026", "data": {"Recommendations": {"headers": ["Title", "Tags", "Type", "Summary", "Speaker / Writer", "Recommended by", "Date Added", "Link"], "records": [{"Title": "A Wandering Mind is an Unhappy One", "Tags": "Psychology, Happiness", "Type": "Research Paper/Article", "Summary": "Covers a landmark Harvard study by Matthew Killingsworth and Dan Gilbert that tracked people’s thoughts and moods in real time. Pioneering work correlating happiness and mind wandering. Gilbert’s book Stumbling on Happiness is a fun follow-up.", "Speaker / Writer": "Jason Castro", "Recommended by": "RD", "Date Added": "Nov-2024", "Link": "https://www.scientificamerican.com/article/a-wandering-mind-is-an-un/"}, {"Title": "Human Behavioral Biology (Stanford lecture series, 25 videos)", "Tags": "Neuroscience, Psychology", "Type": "Playlist", "Summary": "Sapolsky’s full Stanford course on why we behave the way we do. It moves across evolution, genetics, hormones, neuroscience and culture, showing that no single factor explains behaviour. Long but rewarding for anyone curious about the machinery behind thoughts, emotions and actions.", "Speaker / Writer": "Robert Sapolsky", "Recommended by": "RD", "Date Added": "Nov-2024", "Link": "https://youtube.com/playlist?list=PL150326949691B199&si=ztuOlknPpTM5JrSF"}, {"Title": "The Biology of Humans at Our Best and Worst", "Tags": "Neuroscience, Psychology", "Type": "Video", "Summary": "A single talk based on his book Behave. Sapolsky traces a behaviour backwards in time, from the brain a second before, to hormones hours before, to childhood, genes and culture. A compact entry point if the full lecture series feels like too much.", "Speaker / Writer": "Robert Sapolsky", "Recommended by": "RD", "Date Added": "Nov-2024", "Link": "https://youtu.be/GRYcSuyLiJk?si=gyUQLB0aM15nR_YB"}, {"Title": "Grounds for Laziness and Arousing Energy\nkusītārambhavatthusutta", "Tags": "Buddha’s Teachings, Meditation", "Type": "Sutta", "Summary": "The Buddha lists eight everyday excuses for skipping practice, such as being tired, having work ahead, or feeling unwell. He then flips each one into a reason to practise now. Short, practical and very usable for keeping practice steady.", "Speaker / Writer": "Bhikkhu Sujato", "Recommended by": "Bhante Aruno", "Date Added": "Jan-2025", "Link": "https://suttacentral.net/an8.80/en/sujato?lang=en&layout=linebyline&reference=none&notes=asterisk&highlight=false&script=IASTPali"}, {"Title": "Jhanas -  Buddhist Meditative Absorptions in Modern Times.", "Tags": "Buddha’s Teachings, Meditation", "Type": "Video", "Summary": "Brasington explains the jhanas, deep states of concentrated absorption described by the Buddha, and how lay practitioners can access them today. He covers what each state feels like and how they support insight. Recommended viewing: minutes 23 to 55.", "Speaker / Writer": "Leigh Brasington", "Recommended by": "Mridul", "Date Added": "Jan-2025", "Link": "https://youtu.be/RCLT64SLYZk?si=bV4dCBpnLSgayC9y"}, {"Title": "Graceful Exits: How Great Beings Die", "Tags": "Impermanence, Wisdom Traditions", "Type": "Book", "Summary": "A collection of short accounts of how spiritual masters from Hindu, Buddhist, Zen, Taoist and other traditions met their deaths. Each story shows calm, humour or clarity at the final moment, offering a gentle way to reflect on our own mortality", "Speaker / Writer": "Sushila Blackman", "Recommended by": "Bhante Aruno", "Date Added": "Feb-2025", "Link": "https://books.google.com/books/about/Graceful_Exits.html?id=XN9OEAAAQBAJ"}, {"Title": "AI Overly Affirms Users Asking for Personal Advice", "Tags": "Technology & AI, Psychology, Relationships", "Type": "Research Paper/Article", "Summary": "A Stanford study published in Science found that AI chatbots, including ChatGPT, Claude, Gemini and DeepSeek, endorse users’ positions in personal conflicts about 49% more often than humans do. People who chatted with these agreeable models became more convinced they were right and less willing to apologise, yet still trusted them more. A useful read on how flattery shapes our self-view.", "Speaker / Writer": "Ula Chrobak (Stanford Report), on research by Myra Cheng & Dan Jurafsky", "Recommended by": "Mridul", "Date Added": "May-2026", "Link": "https://news.stanford.edu/stories/2026/03/ai-advice-sycophantic-models-research"}, {"Title": "Cultivating the Twelve Kinds of Wealth", "Tags": "Buddha’s Teachings", "Type": "Transcript", "Summary": "A New Year’s Eve 2011 address to the worldwide sangha from Mindrolling Monastery, introducing twelve kinds of wealth for practitioners to cultivate. She reframes wealth as far more than money, starting with the wealth of Dharma (cultivating one’s own mind)", "Speaker / Writer": "Mindrolling Jetsün Khandro Rinpoche", "Recommended by": "Smita", "Date Added": "Sep-2026", "Link": "https://drive.google.com/file/d/1o0wn-OGwtK236uXUc2Cu-Ji-HRSyUFRo/view?usp=sharing"}]}, "Retreat Videos": {"headers": ["Day", "Theme", "Link"], "records": [{"Day": "Day 1", "Theme": "Pay Attention to Attention", "Link": "https://www.youtube.com/playlist?list=PLJcbKASoPb1wJvymrRq0WJ685YDPGhymJ"}, {"Day": "Day 2", "Theme": "The Pleasure Pain Pilot", "Link": "https://www.youtube.com/playlist?list=PLJcbKASoPb1yNFilIKBaRdVcdIWWok4MT"}, {"Day": "Day 3", "Theme": "If It's Craving, It's Personal", "Link": "https://www.youtube.com/playlist?list=PLJcbKASoPb1xBp_QSQw4-OGFHuTZFS_jU"}, {"Day": "Day 4", "Theme": "Progress in Practice- the Collected States", "Link": "https://youtu.be/ES4ztPSgDW4"}, {"Day": "Day 5", "Theme": "DIY Reality", "Link": "https://www.youtube.com/playlist?list=PLJcbKASoPb1w7VTMK0rybYijb9mR7SDk6"}, {"Day": "Day 6", "Theme": "Me, Mine, Myself", "Link": "https://youtu.be/58ymKU3Ru8w"}, {"Day": "Day 7", "Theme": "The Wisdom Stack", "Link": "https://youtu.be/_tbcRrzY5xU"}, {"Day": "Day 8", "Theme": "10/10 Life", "Link": "https://www.youtube.com/playlist?list=PLJcbKASoPb1zeh1KYeJgTLSjBok3wnY6j"}]}, "Pauses & Meditations": {"headers": ["Name", "Link"], "records": [{"Name": "Guided Pauses", "Link": "https://drive.google.com/drive/folders/1PhE29pol3rqut5nnGLuUh0F8LK8t_JI7"}, {"Name": "Guided Meditation", "Link": "https://drive.google.com/drive/folders/129hiTeZolOPCiYBt4LXOMGayqRxfkQRn"}]}}};   // copy baked in at build time, used only if the live sheet can't be reached
const CACHE_KEY = "nerdinglib.cache.v1";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase();

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function toRecords(rows){
  if(!rows.length) return {headers:[],records:[]};
  const head = rows[0].map(h=>h.trim());
  const keep = head.map((h,i)=> h!=="" || rows.slice(1).some(r=>(r[i]||"").trim()!==""));
  const headers = head.map((h,i)=> h || (i===0?"Name":"Column "+(i+1))).filter((_,i)=>keep[i]);
  const records = rows.slice(1).map(r=>{
    const o={}; let j=0;
    head.forEach((_,i)=>{ if(keep[i]) o[headers[j++]]=(r[i]||"").trim(); });
    return o;
  }).filter(o=>Object.values(o).some(v=>v!==""));
  return {headers,records};
}

/* column lookup by header name, tolerant to small renames */
function col(rec, ...names){
  for(const n of names){ for(const k in rec){ if(norm(k).replace(/[^a-z]/g,"").startsWith(norm(n).replace(/[^a-z]/g,""))) return rec[k]; } }
  return "";
}
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDate(s){
  s=(s||"").trim(); if(!s) return 0;
  let m=s.match(/^([A-Za-z]{3})[a-z]*[-\s\/]+(\d{2,4})$/);
  if(m&&MONTHS[m[1].toLowerCase()]!=null){ let y=+m[2]; if(y<100) y+=2000; return Date.UTC(y,MONTHS[m[1].toLowerCase()],1); }
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); // d/m/y or m/d/y – treat as d/m/y
  if(m){ let y=+m[3]; if(y<100) y+=2000; return Date.UTC(y,+m[2]-1,+m[1]); }
  const t=Date.parse(s); return isNaN(t)?0:t;
}
function domain(url){ try{ return new URL(url).hostname.replace(/^www\.|^m\./,""); }catch(e){ return ""; } }
function linkLabel(url){
  const d=domain(url);
  if(/youtu/.test(d)) return /playlist/.test(url)?"YouTube playlist":"YouTube";
  if(/drive\.google|docs\.google/.test(d)) return "Google Drive";
  if(/suttacentral/.test(d)) return "SuttaCentral";
  if(/books\.google/.test(d)) return "Google Books";
  return d;
}
const TYPE_COLORS=["#6B7866","#A9A72B","#2E5252","#C29992","#A45F53","#4B5676","#35685E","#9C8F74"];
function typeColor(t){ let h=0; for(const c of norm(t)) h=(h*31+c.charCodeAt(0))>>>0; return TYPE_COLORS[h%TYPE_COLORS.length]; }

/* ---------- data loading ---------- */
let DATA = {};       // tabName -> {headers, records}
let SOURCE = "";
async function fetchTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const txt=await r.text();
  if(/^\s*</.test(txt)) throw new Error("Sheet not public");
  return toRecords(parseCSV(txt));
}
async function load(manual){
  const btn=$("#refresh"); btn.classList.add("spin");
  if(manual) setStatus("warn","Checking the sheet for new entries…");
  try{
    const out={};
    await Promise.all(TABS.map(async t=>{ out[t.name]=await fetchTab(t.name); }));
    DATA=out; SOURCE="live";
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(),data:out})); }catch(e){}
    setStatus("ok","Live from the sheet · checked "+timeStr(new Date()));
  }catch(err){
    let cached=null; try{ cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(e){}
    if(cached&&cached.data){ DATA=cached.data; SOURCE="cache";
      setStatus("off","Couldn't reach the sheet. Showing your copy from "+new Date(cached.at).toLocaleDateString(undefined,{day:"numeric",month:"short"})+". Tap ↻ to retry.");
    }else{ DATA=SNAPSHOT.data; SOURCE="snapshot";
      setStatus("off","Couldn't reach the sheet. Showing a saved copy from "+SNAPSHOT.taken+".");
    }
  }finally{ btn.classList.remove("spin"); render(); }
}
function setStatus(kind,msg){ const el=$("#status"); if(!el) return; el.innerHTML=`<i class="dot ${kind==="ok"?"":kind}"></i><span>${esc(msg)}</span>`; }
function timeStr(d){ return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }

/* ---------- state ---------- */
const state={ tab:TABS[0].name, q:"", sort:"new", f:{tags:new Set(),type:new Set(),rec:new Set(),year:new Set()} };
try{ const s=JSON.parse(localStorage.getItem("nerdinglib.prefs")||"{}"); if(s.sort) state.sort=s.sort; if(s.tab&&TABS.some(t=>t.name===s.tab)) state.tab=s.tab; }catch(e){}
if(location.hash){ const h=location.hash.slice(1); const t=TABS.find(t=>slug(t.label)===h); if(t) state.tab=t.name; }
function savePrefs(){ try{ localStorage.setItem("nerdinglib.prefs",JSON.stringify({sort:state.sort,tab:state.tab})); }catch(e){} }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

/* ---------- library model ---------- */
function libItems(){
  const t=TABS.find(t=>t.kind==="library"); const d=DATA[t?.name]; if(!d) return [];
  return d.records.map((r,i)=>{
    const tags=col(r,"Tags","Tag","Topics").split(/[,;|]/).map(s=>s.trim()).filter(Boolean);
    const titleRaw=col(r,"Title","Name");
    const [title,...rest]=titleRaw.split(/\n+/);
    const date=col(r,"Date Added","Date");
    const ts=parseDate(date);
    return { i, title:title.trim(), alt:rest.join(" ").trim(), tags, type:col(r,"Type","Format"), summary:col(r,"Summary","Description","Notes"),
      speaker:col(r,"Speaker","Writer","Author"), rec:col(r,"Recommended by","Added by","Shared by"), date, ts,
      year: ts?String(new Date(ts).getUTCFullYear()):"", link:col(r,"Link","URL") };
  }).filter(x=>x.title||x.link);
}
function facet(items,key){
  const m=new Map();
  items.forEach(it=>{ (key==="tags"?it.tags:[it[key]]).forEach(v=>{ if(v) m.set(v,(m.get(v)||0)+1); }); });
  return [...m.entries()].sort((a,b)=> key==="year" ? b[0].localeCompare(a[0]) : (b[1]-a[1]||a[0].localeCompare(b[0])));
}
function matches(it,skip){
  const F=state.f;
  if(skip!=="tags"&&F.tags.size&&!it.tags.some(t=>F.tags.has(t))) return false;
  if(skip!=="type"&&F.type.size&&!F.type.has(it.type)) return false;
  if(skip!=="rec"&&F.rec.size&&!F.rec.has(it.rec)) return false;
  if(skip!=="year"&&F.year.size&&!F.year.has(it.year)) return false;
  if(state.q){
    const hay=norm([it.title,it.alt,it.summary,it.speaker,it.rec,it.type,it.tags.join(" ")].join(" "));
    if(!norm(state.q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false;
  }
  return true;
}
const cmp=(a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"});
function sorted(list){
  const s=state.sort, L=[...list];
  if(s==="new") L.sort((a,b)=>b.ts-a.ts||b.i-a.i);
  else if(s==="old") L.sort((a,b)=>a.ts-b.ts||a.i-b.i);
  else if(s==="title") L.sort((a,b)=>cmp(a.title,b.title));
  else if(s==="speaker") L.sort((a,b)=>cmp(a.speaker||"~",b.speaker||"~"));
  else if(s==="type") L.sort((a,b)=>cmp(a.type||"~",b.type||"~")||b.ts-a.ts);
  else if(s==="rec") L.sort((a,b)=>cmp(a.rec||"~",b.rec||"~")||b.ts-a.ts);
  return L;
}
const fCount=()=>Object.values(state.f).reduce((n,s)=>n+s.size,0);

/* ---------- render ---------- */
function render(){
  renderTabs();
  const t=TABS.find(t=>t.name===state.tab)||TABS[0];
  $("#libView").classList.toggle("hidden",t.kind!=="library");
  $("#simpleView").classList.toggle("hidden",t.kind==="library");
  if(t.kind==="library") renderLib(); else renderSimple(t);
}
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>{
    const n=DATA[t.name]?.records.length;
    return `<button class="tab" role="tab" aria-selected="${t.name===state.tab}" data-tab="${esc(t.name)}">${esc(t.label)}${n!=null?`<span class="n">${n}</span>`:""}</button>`;
  }).join("");
}
function renderLib(){
  const all=libItems();
  const tagFacet=facet(all,"tags");
  $("#quickTags").innerHTML=tagFacet.map(([v])=>`<button class="chip" data-f="tags" data-v="${esc(v)}" aria-pressed="${state.f.tags.has(v)}">${esc(v)}</button>`).join("");
  const list=sorted(all.filter(it=>matches(it)));
  const n=fCount();
  $("#fcount").textContent=n; $("#fcount").classList.toggle("hidden",!n);
  $("#clearAll").classList.toggle("hidden",!(n||state.q));
  $("#qclear").style.display=state.q?"block":"none";
  $("#count").textContent= list.length===all.length ? `${all.length} resources` : `${list.length} of ${all.length} resources`;
  if(!all.length){ $("#list").innerHTML=`<div class="skeleton"></div><div class="skeleton"></div>`; return; }
  if(!list.length){ $("#list").innerHTML=`<div class="empty"><b>Nothing matches yet</b>Try fewer filters or a different word.</div>`; return; }
  $("#list").innerHTML=list.map(it=>`
    <article class="card tap" data-item="${it.i}">
      <div class="top"><span class="type"><i style="background:${typeColor(it.type)}"></i>${esc(it.type||"Link")}</span><span>${esc(it.date)}</span></div>
      <h2>${esc(it.title)}</h2>
      ${it.speaker?`<div class="by">${esc(it.speaker)}</div>`:""}
      ${it.summary?`<p class="sum">${esc(it.summary)}</p>`:""}
      <button class="more" data-item="${it.i}">Read more</button>
      <div class="foot">
        <div class="rec">${it.rec?`Shared by <b>${esc(it.rec)}</b>`:""}</div>
        ${it.link?`<a class="open" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(linkLabel(it.link)||"Open")}${ARROW}</a>`:""}
      </div>
    </article>`).join("");
}
const ARROW=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>`;

/* ---------- details panel ---------- */
function openDetail(i){
  const it=libItems().find(x=>x.i===i); if(!it) return;
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";
  $("#detailBody").innerHTML=`
    <div class="dtop"><span class="type"><i style="background:${typeColor(it.type)}"></i>${esc(it.type||"Link")}</span><span>${esc(it.date)}</span></div>
    <h2>${esc(it.title)}${it.alt?`<small>${esc(it.alt)}</small>`:""}</h2>
    ${it.speaker?`<div class="by">${esc(it.speaker)}</div>`:""}
    ${it.summary?`<p class="dsum">${esc(it.summary)}</p>`:""}
    <dl>
      ${row("Topics", it.tags.map(t=>`<button class="chip" data-f="tags" data-v="${esc(t)}" data-close="1" aria-pressed="${state.f.tags.has(t)}">${esc(t)}</button>`).join(""))}
      ${row("Type", esc(it.type))}
      ${row("Shared by", esc(it.rec))}
      ${row("Added", esc(it.date))}
      ${row("Source", esc(linkLabel(it.link)))}
    </dl>`;
  $("#detailFt").innerHTML=`<button id="detailClose">Close</button>${it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">Open link${ARROW}</a>`:""}`;
  $("#detailBody").scrollTop=0;
  $("#detail").classList.add("on"); $("#scrim").classList.add("on");
  try{ history.pushState({detail:1},""); }catch(e){}
}
function closeDetail(fromPop){
  if(!$("#detail").classList.contains("on")) return;
  $("#detail").classList.remove("on"); $("#scrim").classList.remove("on");
  if(!fromPop && history.state && history.state.detail){ try{ history.back(); }catch(e){} }
}
window.addEventListener("popstate",()=>closeDetail(true));
function renderSimple(t){
  const d=DATA[t.name];
  if(!d){ $("#simpleList").innerHTML=`<div class="skeleton"></div>`; return; }
  const linkKey=d.headers.find(h=>/link|url/i.test(h));
  const textKeys=d.headers.filter(h=>h!==linkKey);
  $("#simpleList").innerHTML=d.records.map(r=>{
    const vals=textKeys.map(k=>r[k]).filter(Boolean);
    const lab=vals.length>1?vals[0]:"", title=vals.length>1?vals.slice(1).join(" · "):(vals[0]||"Untitled");
    const url=r[linkKey]||"";
    const inner=`${lab?`<div class="lab">${esc(lab)}</div>`:`<div class="lab">▶</div>`}
      <div class="txt"><b>${esc(title)}</b><span>${esc(linkLabel(url))}</span></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>`;
    return url?`<a class="card simple" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="card simple">${inner}</div>`;
  }).join("") || `<div class="empty"><b>Nothing here yet</b></div>`;
}

/* ---------- filter sheet ---------- */
const GROUPS=[["tags","Topics"],["type","Type"],["rec","Shared by"],["year","Year added"]];
function renderSheet(){
  const all=libItems();
  $("#sheetBody").innerHTML=GROUPS.map(([k,label])=>{
    const vals=facet(all,k); if(!vals.length) return "";
    return `<h4>${label}</h4><div class="wrapchips">${vals.map(([v,c])=>`<button class="chip" data-f="${k}" data-v="${esc(v)}" aria-pressed="${state.f[k].has(v)}">${esc(v)} <span style="opacity:.55">${c}</span></button>`).join("")}</div>`;
  }).join("");
  const n=all.filter(it=>matches(it)).length;
  $("#sheetApply").textContent=`Show ${n} result${n===1?"":"s"}`;
}
function openSheet(){ renderSheet(); $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){ state.tab=tab.dataset.tab; const t=TABS.find(x=>x.name===state.tab); try{ history.replaceState(null,"","#"+slug(t.label)); }catch(_){ } savePrefs(); render(); window.scrollTo({top:0}); return; }
  const chip=e.target.closest("[data-f]");
  if(chip){ const s=state.f[chip.dataset.f], v=chip.dataset.v;
    if(chip.dataset.close){ s.add(v); closeDetail(); renderLib(); window.scrollTo({top:0,behavior:"smooth"}); return; }
    s.has(v)?s.delete(v):s.add(v);
    renderLib(); if($("#sheet").classList.contains("on")) renderSheet(); return; }
  if(e.target.closest("#detailClose")){ closeDetail(); return; }
  if(e.target.closest("a")) return;
  const card=e.target.closest("[data-item]");
  if(card){ openDetail(+card.dataset.item); }
});
let qt; $("#q").addEventListener("input",e=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.q=e.target.value.trim(); renderLib(); },120); });
$("#qclear").onclick=()=>{ $("#q").value=""; state.q=""; renderLib(); $("#q").focus(); };
$("#sort").value=state.sort;
$("#sort").onchange=e=>{ state.sort=e.target.value; savePrefs(); renderLib(); };
$("#clearAll").onclick=()=>{ Object.values(state.f).forEach(s=>s.clear()); state.q=""; $("#q").value=""; renderLib(); };
$("#sheetClear").onclick=()=>{ Object.values(state.f).forEach(s=>s.clear()); renderSheet(); renderLib(); };
$("#openFilters").onclick=openSheet;
$("#sheetApply").onclick=closeSheet; $("#sheetClose").onclick=closeSheet; $("#scrim").onclick=()=>{ closeSheet(); closeDetail(); };
$("#refresh").onclick=()=>load(true);
$("#sheetLink").href=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
// re-check the sheet when someone comes back to the tab after a while
let lastLoad=Date.now();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&Date.now()-lastLoad>5*60e3){ lastLoad=Date.now(); load(false); } });

render();
load(false);
</script>
</body>
</html>
